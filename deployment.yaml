apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-cicd-app
  labels:
    app: java-cicd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-cicd-app
  template:
    metadata:
      labels:
        app: java-cicd-app
    spec:
      containers:
        - name: java-cicd-app
          image: 423671573887.dkr.ecr.ap-south-1.amazonaws.com/java-cicd-app:6
          ports:
            - containerPort: 8080
